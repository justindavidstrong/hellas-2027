<title>Greece Study Tour Companion</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400;1,700&family=Marcellus&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout concept: a reading-room index. Inscriptional capitals for headings, a scholar's serif for the citations,
   a quiet sans for controls. Three rooms: the essay themes, the library behind them, and the student's own list. */
:root {
  --bg: #F1F4F3;
  --panel: #E6EBEA;
  --ink: #142025;
  --muted: #475A60;
  --rule: #C3CECD;
  --rule-strong: #6F8286;
  --accent: #0B5A78;
  --on-accent: #FFFFFF;
  --clay: #8A3416;
  --sea: #D3E3EA; --land: #F7F4E8; --coast: #55696E;
  --font-display: 'Marcellus', 'Trajan Pro', Georgia, serif;
  --font-text: 'Gentium Book Plus', 'Gentium Plus', Georgia, 'Times New Roman', serif;
  --font-ui: 'Source Sans 3', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --barh: 0px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1619; --panel: #172125; --ink: #E5ECEB; --muted: #A3B3B7; --rule: #2B3A3F; --rule-strong: #6E8489;
    --accent: #7CC8E3; --on-accent: #08171D; --clay: #F0A98A; color-scheme: dark;
    --sea: #0B1B23; --land: #22343A; --coast: #8FA7AD;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1619; --panel: #172125; --ink: #E5ECEB; --muted: #A3B3B7; --rule: #2B3A3F; --rule-strong: #6E8489;
  --accent: #7CC8E3; --on-accent: #08171D; --clay: #F0A98A; color-scheme: dark;
  --sea: #0B1B23; --land: #22343A; --coast: #8FA7AD;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 1rem/1.5 var(--font-ui);
  padding-block: 0 4rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.wrap { max-width: 80rem; margin-inline: auto; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }

/* masthead */
.mast { display: grid; gap: .6rem; padding-block: 2.25rem 1.5rem; }
.eyebrow { margin: 0; font: 600 .75rem/1.3 var(--font-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font: 400 clamp(1.8rem, 4.4vw, 2.9rem)/1.08 var(--font-display); letter-spacing: .01em; text-wrap: balance; }
.lede { margin: 0; max-width: 46rem; color: var(--muted); font-size: 1.0625rem; text-wrap: pretty; }

/* control bar */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem 1rem; padding-block: .75rem; background: var(--bg); border-block: 1px solid var(--rule); }
@media (min-width: 52rem) { .bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; } }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--ink); border-radius: 4px; overflow: hidden; }
.seg a, .seg button {
  display: inline-flex; align-items: center; gap: .4rem; padding: .55rem .95rem; background: transparent; border: 0; border-right: 1px solid var(--ink);
  font: 600 .9375rem/1.2 var(--font-ui); min-height: 2.5rem; color: var(--ink); text-decoration: none;
}
.seg > :last-child { border-right: 0; }
.seg [aria-pressed="true"], .seg [aria-current="page"] { background: var(--ink); color: var(--bg); }
.seg :focus-visible { outline-offset: -4px; }
.seg .cnt { font-variant-numeric: tabular-nums; font-weight: 700; }
.search { flex: 1 1 14rem; max-width: 26rem; }
.lang { margin-left: auto; display: inline-flex; align-items: center; gap: .15rem; font: 700 .9375rem/1 var(--font-ui); }
.lang button { min-height: 2.5rem; min-width: 2.75rem; padding: .5rem .55rem; background: transparent; border: 1px solid transparent; border-radius: 4px; color: var(--muted); font: inherit; letter-spacing: .06em; }
.lang button[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }
.lang button:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.lang .sep { color: var(--rule-strong); }
.search input { width: 100%; min-height: 2.5rem; padding: .5rem .8rem; background: var(--bg); color: var(--ink); border: 1px solid var(--rule-strong); border-radius: 4px; }
.search input::placeholder { color: var(--muted); }

/* shared bits */
.btn { min-height: 2.25rem; padding: .35rem .8rem; background: transparent; border: 1px solid var(--ink); border-radius: 4px; font: 600 .875rem/1.1 var(--font-ui); }
.btn:hover { background: var(--ink); color: var(--bg); }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.linkbtn { background: none; border: 0; padding: .2rem 0; font: 600 .875rem var(--font-ui); color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.fallback { margin-top: .75rem; display: grid; gap: .4rem; }
.fallback textarea { width: 100%; min-height: 8rem; padding: .6rem; font: 400 .9375rem/1.45 var(--font-text); background: var(--bg); color: var(--ink); border: 1px solid var(--rule-strong); border-radius: 4px; }
.page-h { margin: 0; font: 400 clamp(1.4rem, 3vw, 2rem)/1.15 var(--font-display); letter-spacing: .02em; text-wrap: balance; }
.page-h:focus { outline: none; }
.prose { max-width: 46rem; display: grid; gap: .75rem; padding-top: 1.5rem; }
.prose p { margin: 0; text-wrap: pretty; }
.prose .linkbtn { font: inherit; padding: 0; }
.dlmsg { margin-left: .4rem; color: var(--muted); font-size: .9375rem; }
.prose .small { color: var(--muted); font-size: .9375rem; }

/* theme grid */
.tgrid { list-style: none; margin: 1.75rem 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr)); gap: 1rem; }
.tcard {
  display: grid; gap: .3rem; align-content: start; height: 100%; padding: 1rem 1.1rem 1.1rem; text-decoration: none; color: var(--ink);
  border: 1px solid var(--rule-strong); border-top: 4px solid var(--ink); border-radius: 3px; background: var(--panel);
}
.tcard:hover { border-color: var(--accent); border-top-color: var(--accent); }
.tnum { font: 700 .75rem/1 var(--font-ui); letter-spacing: .14em; color: var(--muted); font-variant-numeric: tabular-nums; }
.tt { font: 400 1.125rem/1.25 var(--font-display); letter-spacing: .01em; text-wrap: balance; }
.tnb { font: italic 400 .9375rem/1.35 var(--font-text); color: var(--muted); }
.tc { margin-top: .35rem; font: 600 .8125rem/1.3 var(--font-ui); color: var(--accent); }

/* theme page */
.back { display: inline-block; margin-top: 1.25rem; font: 600 .9375rem var(--font-ui); }
.thead { display: grid; gap: .35rem; padding-block: .9rem 0; }
.thead .nb { margin: 0; font: italic 400 1.0625rem/1.4 var(--font-text); color: var(--muted); }
.tintro { margin: .9rem 0 0; max-width: 46rem; font: 400 1.0625rem/1.55 var(--font-text); text-wrap: pretty; }
.lab { margin: 2rem 0 0; padding-bottom: .4rem; border-bottom: 2px solid var(--ink); font: 400 1rem/1.2 var(--font-display); letter-spacing: .14em; text-transform: uppercase; }
.rl { list-style: none; margin: 0; padding: 0; }
.rd { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; gap: .5rem 1.25rem; padding-block: 1rem; border-bottom: 1px solid var(--rule); }
.rtext { display: grid; gap: .4rem; min-width: 0; }
.rd > .star { grid-column: 2; grid-row: 1; }
@media (max-width: 40rem) { .rd { grid-template-columns: minmax(0, 1fr); } .rd > .star { grid-column: 1; grid-row: 2; justify-self: start; } }
.rlab { margin: 0; max-width: 46rem; padding-left: 1.5rem; text-indent: -1.5rem; font: 400 1.0625rem/1.45 var(--font-text); }
.rnote { margin: 0; max-width: 46rem; font-size: .96875rem; text-wrap: pretty; }
.more { max-width: 46rem; }
.more summary { cursor: pointer; font: 600 .875rem var(--font-ui); color: var(--accent); padding-block: .2rem; }
.more[open] summary { margin-bottom: .6rem; }
.more .in { display: grid; gap: .55rem; padding: .85rem 1rem; border-left: 3px double var(--rule-strong); background: var(--panel); }
.dig { margin-top: 2rem; }
.digbtn {
  width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .85rem 1rem; text-align: left;
  background: var(--panel); border: 1px solid var(--ink); border-radius: 4px; font: 600 1rem/1.3 var(--font-ui);
}
.digbtn:hover { background: var(--ink); color: var(--bg); }
.digbtn .t { font: 400 1.125rem/1.2 var(--font-display); letter-spacing: .1em; text-transform: uppercase; }
.digbtn .s { font-weight: 400; color: inherit; opacity: .85; }
.digbtn .chev { font-size: 1.1rem; transition: transform .15s; flex: none; }
.digbtn[aria-expanded="true"] .chev { transform: rotate(90deg); }
.toLib { margin: 1.75rem 0 0; display: flex; flex-wrap: wrap; gap: .75rem 1.5rem; align-items: center; }
.pn { display: flex; justify-content: space-between; gap: 1rem; margin-top: 2.5rem; padding-top: 1rem; border-top: 1px solid var(--rule); font: 600 .9375rem var(--font-ui); }
.pn a { max-width: 48%; }
.pn .nx { margin-left: auto; text-align: right; }

/* library columns */
.cols { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0 2.5rem; padding-top: 1.25rem; }
@media (min-width: 52rem) { .cols { grid-template-columns: 17.5rem minmax(0, 1fr); } }
.side { min-width: 0; }
@media (min-width: 52rem) {
  .side { position: sticky; top: calc(var(--barh) + env(safe-area-inset-top, 0px) + .75rem); align-self: start;
    max-height: calc(100vh - var(--barh) - 1.5rem); overflow-y: auto; padding-right: .5rem; padding-bottom: 1rem; }
  .side summary { display: none; }
}
.side details { border: 1px solid var(--rule); border-radius: 4px; background: var(--panel); }
@media (min-width: 52rem) { .side details { border: 0; background: transparent; } }
.side summary { padding: .7rem .9rem; font: 600 .9375rem var(--font-ui); cursor: pointer; }
.fbody { padding: .25rem .9rem 1rem; display: grid; gap: 1.1rem; }
@media (min-width: 52rem) { .fbody { padding: 0; } }
.fhead { display: flex; align-items: baseline; justify-content: space-between; gap: .5rem; }
.fhead h2 { margin: 0; font: 400 1rem/1.2 var(--font-display); letter-spacing: .12em; text-transform: uppercase; }
#facets { display: grid; gap: 1.25rem; }
.fam h3 { margin: 0 0 .15rem; font: 700 .75rem/1.2 var(--font-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.fam .fh { margin: 0 0 .5rem; font-size: .8125rem; color: var(--muted); }
.fam h3 + .taglist { margin-top: .5rem; }
.taglist { display: flex; flex-wrap: wrap; gap: .4rem; }
.chip {
  display: inline-flex; align-items: center; gap: .3rem; min-height: 2rem; padding: .3rem .65rem; background: transparent; color: var(--ink);
  border: 1px solid var(--rule-strong); border-radius: 999px; font: 600 .8125rem/1.1 var(--font-ui); text-decoration: none;
}
.chip.site { border-radius: 3px; border-color: var(--ink); font-weight: 700; }
.chip .g { opacity: .75; }
.chip .n { margin-left: .15rem; font-weight: 400; font-variant-numeric: tabular-nums; opacity: .8; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chip[aria-pressed="true"] .g { opacity: 1; }
.chip:hover:not(:disabled) { border-color: var(--accent); }
.chip:disabled { opacity: .45; cursor: default; }
.chip.sm { min-height: 1.7rem; padding: .2rem .55rem; font-size: .75rem; }
.chip.theme { border-style: dashed; }

.grpbar { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .9rem; }
.grpbar .lbl, .active .lbl { font: 600 .875rem var(--font-ui); color: var(--muted); }
.active { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .6rem; padding: .75rem 0 0; }
.sumline { margin: 0; padding-block: .9rem .2rem; display: flex; flex-wrap: wrap; align-items: center; gap: .4rem 1rem; scroll-margin-top: calc(var(--barh) + 1rem); }
.sumline .t { font: 600 .9375rem var(--font-ui); font-variant-numeric: tabular-nums; }
.sumline .t:focus { outline: none; }
.sumline .hint { color: var(--muted); font-size: .875rem; flex-basis: 100%; }
.sumline .btn { margin-left: auto; }

/* groups and entries */
.grp { margin-top: 2.4rem; }
.gh { display: flex; flex-wrap: wrap; align-items: baseline; gap: .15rem 1rem; padding-bottom: .45rem; border-bottom: 2px solid var(--ink); }
.gh h2 { margin: 0; font: 400 1.3rem/1.2 var(--font-display); letter-spacing: .07em; text-transform: uppercase; text-wrap: balance; }
.gh .grc { font: 400 1.25rem/1.2 var(--font-text); color: var(--muted); }
.gh .nbt { font: italic 400 1rem/1.2 var(--font-text); color: var(--muted); }
.gh .cnt { margin-left: auto; font: 600 .8125rem var(--font-ui); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.gl { margin: .45rem 0 0; color: var(--muted); font-size: .9375rem; max-width: 46rem; }
.letter h2 { font-size: 1.6rem; letter-spacing: .04em; }
.subgrp { margin: .4rem 0 0 .25rem; padding-left: 1rem; border-left: 3px double var(--rule-strong); }
.subh { margin: 1.1rem 0 0; font: 700 .8125rem/1.3 var(--font-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.subh i { font-family: var(--font-text); font-size: 1rem; letter-spacing: 0; text-transform: none; font-weight: 400; color: var(--ink); }
.ent { display: grid; gap: .55rem; padding-block: 1.05rem; border-bottom: 1px solid var(--rule); }
.cite { margin: 0; max-width: 46rem; padding-left: 1.5rem; text-indent: -1.5rem; font: 400 1.0625rem/1.5 var(--font-text); }
.cite b { font-weight: 700; }
.reason { margin: 0; max-width: 46rem; font-size: .96875rem; line-height: 1.5; text-wrap: pretty; }
.vnote { color: var(--muted); }
.badges { display: flex; flex-wrap: wrap; gap: .35rem; }
.badge { display: inline-block; padding: .18rem .5rem; font: 700 .6875rem/1.2 var(--font-ui); letter-spacing: .1em; text-transform: uppercase; border: 1px solid var(--ink); border-radius: 2px; }
.badge.opt { border-style: dashed; border-color: var(--rule-strong); color: var(--muted); }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: .45rem .5rem; }
.pages { margin-right: .5rem; font: 600 .875rem var(--font-ui); color: var(--muted); font-variant-numeric: tabular-nums; }
.mf { margin-right: .5rem; font: 600 .875rem var(--font-ui); color: var(--accent); text-underline-offset: 3px; }
.mfx { margin-right: .5rem; font: 400 .875rem var(--font-ui); color: var(--muted); }
.themes { margin: 0; font: 600 .875rem var(--font-ui); color: var(--muted); }
.themes a { font-weight: 600; }
.meta .btn { min-height: 2rem; font-size: .8125rem; }
.meta .btn.first { margin-left: auto; }
.empty { margin: 3rem 0; max-width: 34rem; display: grid; gap: .75rem; }
.empty p { margin: 0; }
.ml-tools { display: flex; flex-wrap: wrap; gap: .5rem .75rem; align-items: center; margin-top: 1.25rem; }
@media (max-width: 40rem) { .meta .btn.first { margin-left: 0; } .gh h2 { font-size: 1.1rem; } .pn { flex-direction: column; } .pn a { max-width: none; } .pn .nx { margin-left: 0; text-align: left; } }

/* theme grid, grouped by the stop where the tour first meets each theme */
.tg { margin-top: 2.2rem; }
.tgh { margin: 0; padding-bottom: .4rem; border-bottom: 2px solid var(--ink); font: 400 1.15rem/1.25 var(--font-display); letter-spacing: .06em; text-transform: uppercase; text-wrap: balance; }
.tgh a { color: inherit; text-decoration-thickness: 1px; }
.tg .tgrid { margin-top: 1rem; }
.tat { font: 600 .8125rem/1.3 var(--font-ui); color: var(--muted); }
.badge.req { border-color: var(--accent); color: var(--accent); }
.otbox { margin-top: 1.1rem; max-width: 46rem; padding: .85rem 1rem; display: grid; gap: .4rem; background: var(--panel); border-left: 4px solid var(--accent); }
.otbox p { margin: 0; font-size: .96875rem; text-wrap: pretty; }
.otbox .h { font: 700 .75rem/1.2 var(--font-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

/* tour map */
.tour { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1.25rem 2.25rem; padding-top: 1.25rem; }
@media (min-width: 52rem) { .tour { grid-template-columns: minmax(0, 34rem) minmax(0, 1fr); } .mapcol { position: sticky; top: calc(var(--barh) + env(safe-area-inset-top, 0px) + .75rem); align-self: start; } }
.mapcol { display: grid; gap: .6rem; min-width: 0; }
.tomap { display: none; }
.mapcol.tall { position: static !important; }
.tviews { scroll-margin-top: calc(var(--barh) + .5rem); display: flex; flex-wrap: wrap; gap: .4rem; }
.tviews .chip[aria-pressed="true"] .g { opacity: 1; }
.mapbox { display: flex; justify-content: center; }
svg.map { display: block; border: 1px solid var(--rule-strong); border-radius: 3px; touch-action: manipulation; }
svg.map .sea { fill: var(--sea); }
svg.map .land { fill: var(--land); stroke: var(--coast); stroke-width: 1.2; stroke-linejoin: round; }
svg.map .route { fill: none; stroke: var(--ink); stroke-width: 2; stroke-dasharray: 7 5; stroke-linecap: round; }
svg.map .lead { stroke: var(--ink); stroke-width: 1; fill: none; }
svg.map .dot { fill: var(--ink); }
svg.map .sealbl { fill: var(--muted); font-family: var(--font-text); font-style: italic; letter-spacing: .12em; }
svg.map .mk { cursor: pointer; outline: none; }
svg.map .mk .d { fill: var(--accent); stroke: var(--bg); stroke-width: 2; vector-effect: non-scaling-stroke; }
svg.map .mk .n { fill: var(--on-accent); font-family: var(--font-ui); font-weight: 700; text-anchor: middle; pointer-events: none; }
svg.map .mk .ring { fill: none; stroke: var(--ink); stroke-width: 3; vector-effect: non-scaling-stroke; }
svg.map .mk .fr { fill: none; stroke: var(--accent); stroke-width: 3; vector-effect: non-scaling-stroke; opacity: 0; }
svg.map .mk:focus-visible .fr { opacity: 1; }
svg.map .mk:hover .d { stroke: var(--ink); }
svg.map .lbl { fill: var(--ink); font-family: var(--font-ui); font-weight: 600; paint-order: stroke; stroke: var(--bg); stroke-linejoin: round; }
svg.map .mk .hit { fill: transparent; stroke: none; }
svg.map .mk.sel .lbl { font-weight: 800; }
.tpanel { min-width: 0; scroll-margin-top: calc(var(--barh) + 1rem); display: grid; gap: 1rem; align-content: start; }
.tpanel h3 { margin: 0; font: 400 clamp(1.4rem, 3vw, 1.9rem)/1.15 var(--font-display); letter-spacing: .02em; text-wrap: balance; }
.tpanel h3:focus { outline: none; }
.tpanel h3 .grc { font: 400 1.1rem var(--font-text); color: var(--muted); margin-left: .5rem; }
.tpanel p { margin: 0; max-width: 46rem; text-wrap: pretty; }
.tpanel .small { color: var(--muted); font-size: .9375rem; }
.pnav { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .75rem; }
.pnav .sp { margin-left: auto; display: flex; gap: .5rem; flex-wrap: wrap; }
.days { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.day { padding-block: .9rem; border-top: 1px solid var(--rule); display: grid; gap: .35rem; }
.day:first-child { border-top: 2px solid var(--ink); }
.day h4, .visit h4 { margin: 0; font: 700 .8125rem/1.3 var(--font-ui); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.dtitle { font: 400 1.125rem/1.3 var(--font-display); }
.dst { list-style: none; margin: 0; padding: 0; display: grid; gap: .35rem; }
.dst li { display: flex; flex-wrap: wrap; align-items: baseline; gap: .15rem .6rem; }
.stopbtn { display: inline-flex; align-items: center; gap: .45rem; min-height: 2.25rem; padding: .25rem .7rem .25rem .3rem; background: transparent; border: 1px solid var(--ink); border-radius: 999px; font: 700 .9375rem/1.2 var(--font-ui); }
.stopbtn:hover, .stopbtn[aria-current="true"] { background: var(--ink); color: var(--bg); }

const NB = {"entries":{"e_g001":"Norskspråklige artikler om den antikke greske verden, fra Det norske institutt i Athen. Tilgjengelig digitalt via Nasjonalbiblioteket.","e_c167":"Norskspråklig kapittel om kroppen, idretten og de olympiske lekene.","e_m024":"Det faglige innlegget om «jøder i Romerriket».","e_g002":"Det sentrale engelskspråklige leksikonet over antikken, i tre serier: Antiquity, Classical Tradition og Supplements.","e_m001":"Bakgrunn for det faglige innlegget ditt om apokalyptisk litteratur.","e_g003":"Et ettbinds oppslagsverk om den jødiske og gresk-romerske bakgrunnen for Det nye testamentet.","e_g004":"Norsk leksikon over antikken, til raske oppslag på personer, steder og begreper.","e_g005":"En innføring i gresk-romerske religioner, blant annet mysteriekultene, keiserkulten og Delfi.","e_c160":"Dion Khrysostomos’ rhodiske tale om æresstatuer og borgeridentitet, lest sammen med Det nye testamentet.","e_g008":"Et bibelleksikon i seks bind, med artikler om steder, personer og emner.","e_m000":"Tar opp spørsmål om status, husstander og foreninger. Dette er grunnteksten som svært mye senere forskning svarer på.","e_g006":"En håndbok med artikler om Paulus i hans gresk-romerske verden.","e_g007":"Norskspråklig studie av Paulus’ sosiale verden som bakgrunn for hans liv og forkynnelse.","e_n000":"En fiktiv fortelling om én uke i det romerske Korint, der vi følger en kjøpmann som møter Paulus, med faktabokser om dagligliv og skikker. En rask og lettlest innføring i byen; bruk den for å få et inntrykk av stemningen, ikke som kilde.","e_g012":"Andre bind av Dunns historie om den tidligste kristendommen, fra Jerusalem til og med Paulus’ misjon.","e_r003":"Paulus om seksualitet, ekteskap og skilsmisse, med 1 Kor 7 i sentrum. Tilgjengelig på nett via Oria.","e_r004":"Paulus’ utsagn om likekjønnede forhold (Rom 1,26–27; 1 Kor 6,9), lest i sin sammenheng. Tilgjengelig på nett via Oria.","e_r005":"Paulus om kvinners rolle i menigheten, blant annet 1 Kor 11,2–16 og 14,33–36 og Gal 3,28. Tilgjengelig på nett via Oria.","e_r006":"Paulus om de kristne og myndighetene, fremfor alt Rom 13,1–7. Tilgjengelig på nett via Oria.","e_r001":"En innføring i problemene ved å lese Det nye testamentet og i strategiene for å gjøre det.","e_g010":"Et oppslagsverk med artikler om Paulus’ liv, brev og teologi.","e_r002":"En innføring i studiet av Paulus: hans liv, hans brev og de viktigste spørsmålene i forskningen.","e_r007":"Om å lese Det nye testamentet og dets bakgrunn i lys av dagens debatt, med homofili som prøvesak. Skrevet av en norsk nytestamentler. Tilgjengelig på nett via Oria.","e_r009":"Porter om forfatterskapet til pastoralbrevene og hva det betyr for kanon. Den første av tre artikler i en meningsutveksling med Wall: les dem i rekkefølge (Porter 1995, Wall 1995, Porter 1996). Tilgjengelig på nett via Oria.","e_r010":"Walls svar til Porter. Den andre artikkelen i meningsutvekslingen. Tilgjengelig på nett via Oria.","e_r011":"Porters svar til Wall. Den siste artikkelen i meningsutvekslingen. Tilgjengelig på nett via Oria.","e_r012":"Pensumdelen er s. 238–45, «Pseudepigraphy and the Question of Authorship»: spørsmålet om Paulus skrev alle brevene som bærer hans navn.","e_m004":"En grundig drøfting av hvilke hendelser som dateres til når og hvorfor, blant annet kronologien for Paulus’ virksomhet.","e_g011":"Norskspråklig innføring i Paulus’ teologi.","e_c150":"Tidlig stoisk etikk (Zenon, Khrysippos, oikeiōsis); bakgrunn for de faglige innleggene om Stoa og om stoisismen på Areopagos.","e_c151":"En lesning av Filipperbrevet på bakgrunn av stoisk etikk. Les etter kapittel 3.","e_c038":"Filippi og Tessalonika: Paulus’ samarbeidspartnere i Filippi og gruppen i Tessalonika.","e_c039":"Korint og Filippi: hvor store gruppene var, og hvor de møttes.","e_c040":"Den sosioøkonomiske sammensetningen av menighetene.","e_c041":"1 Kor 8–11 og besøket ved macellum.","e_c042":"1 Kor 16,1–4 og medlemsbidrag i foreningene.","e_c043":"Gravforeninger. Begravelser som grunn til å danne foreninger.","e_c044":"Om bruk av materielle kilder i nytestamentlige studier.","e_c045":"Slavepriser fra Korint og Delfi; 1 Kor 6,20.","e_c046":"Innskrifter fra Silvanus-helligdommen og Fil 4.","e_c047":"Ødeleggelse, ny bosetting og 1 Kor 15,29.","e_c048":"Pseudepigrafi og 1–2 Tess.","e_c049":"De kristne apologetene og gresk kultur.","e_c050":"Apg 16–18 og greske byer under romersk styre; Apostlenes gjerninger som kilde.","e_c051":"Aten: en atensk apologet om guder og gudebilder.","e_c152":"Omfang, kilder og tilnærming i studiet av kristendommen i Makedonia.","e_c071":"Bakgrunn fra romersk tid: transportnettet og Via Egnatia (s. 41–46), etniske og sosiokulturelle forhold (47–52) og religiøs kontekst (53–63).","e_c072":"Kristendommens begynnelse i 50-årene (s. 69–78, Apostlenes gjerninger), 1 Tess (80–84), 2 Tess (85–88), Filipperbrevet (89–92) og det andre århundret med Polykarps brev (93–100).","e_c153":"Tidlig kristendom i området rundt Filippi, fra det første århundret og inn i senere århundrer.","e_c074":"Tidlig kristendom i området rundt Tessalonika, fra det første århundret og inn i senere århundrer. Omfatter martyrkulter og martyrene i Rotunden (s. 181–96) og kirkearkitektur (s. 215–20), som hører til besøkene ved Demetrioskatedralen og Rotunden.","e_c154":"Hvordan det gresk-romerske gjestebudet fungerte som sosial institusjon, og hvorfor det har betydning for tidligkristen gudstjeneste: sosiale forpliktelser (Paulus’ «oppbyggelse», s. 30), festglede, underholdning (1 Kor 14,26, s. 31) og nattverdtradisjonen i 1 Kor 11,23–25 (s. 24). Inneholder en rekonstruksjonstegning av en spisesal med elleve sofaer fra Asklepieion i Korint (s. 26).","e_c155":"Foreningene og gjestebudene deres: typisk medlemstall (10–50, noen få med flere hundre) og de litterære, arkitektoniske og epigrafiske kildene til måltidene deres. Bakgrunn for temaet om foreninger.","e_c156":"Idealer og praksis ved foreningenes gjestebud: elitens ideal om likebehandling og vennskapelige forhold mellom gjestene, og i hvilken grad foreningenes egen praksis svarte til det.","e_c157":"Om og hvordan kvinner deltok i tidligkristne måltider, og hvordan det passer med praksis i romersk tid. Tar utgangspunkt i menigheten i Korint (1 Kor 1,12; 10–14; 11,2–16, s. 87), der måltidet ble fulgt av et symposion, og drøfter Corley, Klinghardt og Smith.","e_c158":"Når slaver lå til bords ved måltider: atenske fester (s. 157), den spartanske Hyakinthia-festen (s. 158), dyrkelsen av Demeter i Eleusis og i Korint (s. 159–60), og deretter de romerske collegia og Mithraskulten (s. 161). Bakgrunn for besøkene i Eleusis og Korint og for temaet om slaveri.","e_c159":"Slaver og tidligkristne måltider, sett på bakgrunn av Filons terapeuter og lignelsene i evangeliene. Avsnittene om de ubestridte paulusbrevene (s. 192) og de deuteropaulinske brevene (s. 193) ligger nærmest turen.","e_m017":"En utmerket og lettfattelig innføring i oraklet i Delfi.","e_c146":"Kulten, festen og helligdommen i Eleusis. Bakgrunn for besøket i Eleusis og det faglige innlegget om de eleusinske mysteriene.","e_c147":"Isis og mysteriene hennes, blant annet Apuleius’ skildring i Metamorfoser 11, som utspiller seg i Korint (s. 195–201), og Pausanias om Isis-helligdommene i Korint og Kenkreæ.","e_c148":"Mithraskulten og mysteriene dens; bakgrunn for det faglige innlegget om Mithras-kulten.","e_c149":"Hvordan mysteriene tok slutt, og hvordan de forholder seg til de tidlige kristne, blant annet språket om «mysterium» i Paulus’ brev (s. 240–41).","e_c067":"Særlig Lukas’ Paulus og den atenske polyteismen (s. 78–87, Apg 17) og apologetene i det andre århundret (s. 88–111).","e_m015":"Dekker byen fra forhistorisk tid til det senromerske Aten. Gir oversikter over Akropolis, Agora, Areopagos og Pnyx.","e_c170":"Den gresk-romerske byen slik de første kristne så den, med utgangspunkt i Apg 17,16.","e_g013":"Leser Paulus’ tale på Areopagos (Apg 17,22–31) på bakgrunn av den sokratiske tradisjonen.","e_m011":"Etnisitet og identitet i det romerske Korint.","e_m012":"Macellum (matmarkedet) og spørsmålet om offerkjøtt i 1 Kor 8.","e_c024":"Innledning: hvordan boken sammenligner Korint med andre byer.","e_c030":"Teateret og Erastus-innskriften (Rom 16,23).","e_c035":"Isthmia og det østlige Korinthia: helligdommer og tidlige kirker.","e_c027":"Forum: keiserkulten i bysentrum (et langt kapittel om ett enkelt monument).","e_c025":"Korint: hvem de romerske kolonistene var; historien til det romerske Korint.","e_c029":"Akrokorint: kulten for Demeter og Kore; skrevet av en norsk forsker.","e_c034":"Kenkreæ: havnen, kultene der (fremfor alt Isis) og Føbe. Et langt kapittel; les det selektivt.","e_c037":"Korints landskap og lokale tradisjoner (Peirene-kilden).","e_c032":"Den sosioøkonomiske sammensetningen av menigheten og hvor den møttes.","e_c028":"Besøket ved Apollon-tempelet: templer og blandingen av gresk og romersk.","e_c033":"1 Kor 11,17–34: nattverden og måltidenes politikk i en romersk koloni. Kapitlet behandler ikke macellum eller 1 Kor 8–10.","e_c026":"Museet og votivgavene til Asklepios: sykdom, medisin og helbredelse.","e_c006":"Besøket i Kenkreæ: en kvinnelig patron i Korint, til sammenligning med Føbe (Rom 16,1–2), som bare nevnes i én setning.","e_c000":"Korint: bokens rammeverk for klasse og den sosioøkonomiske sammensetningen av menigheten.","e_c001":"Korint: byens historie fra ødeleggelsen i 146 f.Kr. til Caesars gjenoppbygging.","e_c007":"1 Kor 7,12–16; emnet ekteskap og kjønn.","e_c002":"Korint: hvem som hadde offentlige embeter i den romerske kolonien, og hvem den lokale eliten var. Erastus nevnes bare i en fotnote; se Friesen, «The Wrong Erastus», i Corinth in Context.","e_c003":"Emnet slaveri: 1 Kor 6,20 og 7,23, lest på bakgrunn av frigivelsesinnskrifter i Delfi.","e_c004":"Akrokorint og kanalen: Korints strategiske beliggenhet, med Isthmos og Kenkreæ.","e_c008":"De fattige på landsbygda og økonomien utenfor byen.","e_c005":"Korint: kult og magi som bakgrunn for besøkene på Akrokorint og ved Apollon-tempelet.","e_n004":"Leser 1 Kor 11–14 på bakgrunn av kjønn og rituelt rom i det romerske Korint (helligdommer, spisesaler, offentlige rom). Økland er professor i kjønnsstudier i humaniora ved Universitetet i Oslo.","e_m014":"De isthmiske lekene og 1 Kor 9 i Isthmia.","e_m009":"Klassiker om klasse i menigheten (Erastus, 1 Kor 1,26, nattverden).","e_m005":"Kommentar til den greske teksten av 1 Kor 1,1–17 og kap. 8 og 12–15.","e_m010":"Retorikk, utdannelse og sofistene bak 1 Kor 1–4.","e_c015":"Slaveri og arbeid; slavejenta i Apg 16.","e_c013":"Hvem som bodde i Filippi; Lydia og Apg 16.","e_c016":"Via Egnatia og reiser; Paulus som brevskriver.","e_c018":"Det antatte fengselet; Paulus i varetekt.","e_c020":"Apg 16 og den pythiske ånden.","e_c021":"Paulus’ fengsel og Lydias dåpssted som senere pilegrimsmål.","e_c019":"Fil 2,5–11 og 3,20 på bakgrunn av lokal religion (gresk tekst i TEOL5291).","e_c017":"Filipperbrevet og den lokale økonomien (Fil 4,10–20).","e_c012":"Koloniens kulter som bakgrunn for Apg 16.","e_c010":"Innføring i dagens forskning på Filippi.","e_c011":"Besøket på forumet: de faste kjennetegnene ved en gresk-romersk by.","e_c022":"Kristendommen i Filippi etter Paulus.","e_c014":"Innbyggere som ikke var romere; identitet i Apostlenes gjerninger og Filipperbrevet.","e_m006":"Menighetens sosiale profil; en motvekt til Friesen om Apg 16.","e_m007":"Artikler om byen, brevene og kultene.","e_c054":"Foreningene og gruppen i Tessalonika; les sammen med Kloppenborg.","e_c063":"Oversikt fra romersk provinshovedstad til kristen by.","e_c059":"Demetrioskatedralen: kirkearkitektur og utsmykning.","e_c058":"Ekte og uekte paulusbrev; pseudepigrafi.","e_c055":"Kvinner i menigheten i Tessalonika.","e_c057":"Religion i antikken: byens egyptiske kulter.","e_c061":"Rotunden og Galeriusbuen.","e_c062":"Kirkens utsmykning og bilder.","e_c052":"Innføring i byen og i boken.","e_c053":"Collegia og det sosiale livet.","e_c060":"Demetrios og martyrtradisjonen.","e_c056":"1 Tess 4,3–8 på bakgrunn av byens templer.","e_m002":"Artikler om Filippi, Tessalonika, Aten og Korint i Apostlenes gjerninger; et supplement til Keener.","e_m003":"Den grundigste nyere kommentaren til Apostlenes gjerninger. Uttømmende gresk-romersk bakgrunn for Apg 15–19, men for lang til å settes opp i sin helhet: omtrent 485 sider for Apg 15,36–18,22 (mitt anslag), rundt fire til fem ganger så mye som Witherington. Sett opp utvalgte deler, for eksempel ekskursen om Filippi (bd. 3, s. 2422–56).","e_c162":"Dåpen i Galaterbrevet (s. 147), 1 og 2 Korinterbrev (s. 149), Romerbrevet (s. 155), Kolosserbrevet (s. 158), Efeserbrevet (s. 161) og Titusbrevet (s. 162), med en oppsummering (s. 164).","e_c163":"Dåpsfortellingene i Apostlenes gjerninger: Lydia og fangevokteren i Filippi (Apg 16,12–34, s. 179), Korint (Apg 18,8, s. 180), Apg 18,24–19,7 (s. 180), dåp i Jesu navn (s. 182), Den hellige ånd og dåpen (s. 183) og en oppsummering (s. 184).","e_c164":"Hvor initiasjonsritene kommer fra, og hva Det nye testamentet viser av dem.","e_c165":"Hvordan initiasjonen ble feiret i menighetene i øst før Nikea.","e_c166":"Hvordan initiasjonen ble feiret i menighetene i vest før Nikea.","e_g024":"Artikler som leser Paulus sammen med de gresk-romerske filosofene.","e_c172":"Definisjoner av apologetikk og av apologien som teksttype.","e_c171":"Hovedtemaene hos de tidligkristne apologetene.","e_g019":"Homer i den greske skoletradisjonen, og hvordan tidligkristne forfattere forholdt seg til de hedenske dikterne.","e_c168":"Justin Martyrs bilde av Sokrates, og hva det viser om jødedom og hellenisme i hans tenkning.","e_r013":"Om Paulus’ kristendom kan sammenlignes med de hellenistiske filosofiske skolene.","e_c169":"Norskspråklig kapittel om loven ved Amfiareion og om mirakuløse helbredelser i greske helligdommer.","e_g020":"Om Jesus som helbreder i evangeliene.","e_n001":"En kort bok (Wiles Lectures) som argumenterer for at det kristne martyriet tok form innenfor den romerske verden: byene, domstolene, de offentlige skuespillene og debattene om selvmord.","e_g027":"Spør om de første kristne tilba Jesus, og hva Det nye testamentet viser.","e_g026":"Om hengivenheten til Jesus i de tidligste kristne gruppene.","e_g028":"En historie om hedenskap og kristendom i den romerske verden; s. 419–92 handler om forfølgelse.","e_g025":"Om hymnene i Det nye testamentet og hvordan de svarer på tilbedelsen.","e_n003":"Standardutgaven av de tidlige martyrberetningene, på gresk og latin med engelsk oversettelse på motstående side og en innledning. Den inneholder Polykarps martyrium. Viktig bakgrunn for temaet om forfølgelse.","e_n002":"Leser henrettelsen av Polykarp på stadion i Smyrna (ca. 155) på bakgrunn av de romerske blodlekene, der dyrejakt, gladiatorkamper og henrettelse av forbrytere viste imperiets makt. Les den sammen med Polykarps martyrium i kompendiet (s. 198–208).","e_g030":"Hvordan de første kristne forholdt seg til de guddommelige æresbevisningene som ble gitt keiserne.","e_m022":"Fattigdomsskalaen som mange forskere legger til grunn, i motsetning til Longenecker, som har en annen modell (se nedenfor).","e_m023":"Fattigdomsskalaen som mange forskere legger til grunn, i motsetning til Friesen, som har en annen modell (se ovenfor).","e_g029":"Det gresk-romerske gjestebudet og dets plass i tidligkristne måltider.","e_c104":"Hvordan slaver ble frigitt, og hva frihet betydde. Går gjennom 1 Kor 7,21–24 og 6,20 («kjøpt og betalt»), sammen med Romerbrevet og Filemonbrevet.","e_c107":"Kjønn og seksuell utnyttelse av slaver. Leser Paulus om pornoi og 1 Kor 6,12–20 (Korint), 1 Tess 4,3–5 (Tessalonika) og Kloe (1 Kor 1,11). Slavejenta i Apg 16 som har en pythisk ånd, nevnes bare i forbifarten.","e_c101":"Hvordan mennesker ble gjort til slaver, og hvordan slaveriet var i den romerske verden (bakgrunn). Korint, Filippi og Tessalonika nevnes bare i forbifarten.","e_c102":"Begynner og slutter med slavejenta i Filippi som har en pythisk ånd (Apg 16,16–40), og spør hva romersk rett og de materielle kildene forteller om livet hennes og om Paulus’ romerske borgerrett.","e_c108":"Slaveri som metafor: «Kristi slave» (Fil 1,1; Apg 16,17) og «Herrens frigitte» i 1 Kor 7,21–22, og hva metaforen gjør med tilhørere som selv var slaver.","e_c100":"Hvorfor «slavegjøring», og hvordan slavespråket i Det nye testamentet (doulos, kyrios) oversettes og brukes. Bruker 1 Kor 7,21–23 («kjøpt og betalt») som hovedeksempel og antyder at slaver tilberedte og serverte nattverden og fellesmåltidene i husmenighetene (med henvisning til 1 Kor 11).","e_c105":"Slavearbeid, tilførsel og slavehandel. Gir eksempler fra Makedonia: fire slavebundne forvaltere i den romerske kolonien Filippi som dyrket Silvanus sammen med frie medlemmer (CIL 3.633), og gravsteinen til en frigitt slavehandler som drev handel fra Amfipolis (jf. Apg 17,1). Berører også 1 Kor 6,20 og 11,21–22.","e_c109":"Hustavlene (Kol 3,22–4,1; Ef 6,5–9) og husstanden som ramme for slavenes liv. Bruker Lydias husstand (Apg 16,11–16) og 1 Kor 7,21–24; 12,13.","e_c106":"Rase og etniske stereotypier om slaver. Drøfter slavejenta med en pythisk ånd (Apg 16,16), som kan ha kommet fra Delfi, og de døpte husstandene (Lydia, fangevokteren i Filippi, Stefanas).","e_m021":"Emnet slaveri, slavejenta med en pythisk ånd, «kjøpt og betalt».","e_c161":"Kvinneskikkelser og slavespråk i tidligkristne tekster. Slavejenta med spådomsånden (Apg 16,16–18) drøftes på s. 54–62.","e_g018":"Gresk idrett og festene der lekene ble holdt. Tilgjengelig digitalt via Oria.","e_g017":"Presenterer antikkens idrett, men hovedmålet er å utvikle en kristen teologisk forståelse av idretten som fenomen.","e_g014":"Norskspråklig bok om gresk idrett og seierskransen.","e_g016":"Gresk idrett presentert gjennom sitater fra de antikke tekstene. Tilgjengelig digitalt via Oria.","e_g015":"En historie om de antikke olympiske lekene.","e_g022":"Om betydningen av husstandsstrukturene for den tidlige kristendommen og misjonen.","e_g023":"Om omvendelse og menigheten som en ny familie, med sammenligninger på tvers av kulturer.","e_g021":"En grundig studie av den tidligkristne misjonen; dette bindet dekker Paulus og den tidlige kirken.","e_m020":"Innskrifter som viser roller av samme slag som Føbes.","e_c126":"Paulus om kvinner og kjønn, blant annet tekstene i 1 Kor 11 og 14.","e_c124":"Kvinnene i Lukas’ evangelium og Apostlenes gjerninger: Lydia i Filippi, Damaris i Aten (Apg 17,34) og Priskilla.","e_c120":"Kvinners rettslige, sosiale og religiøse stilling i den greske og romerske verden (bakgrunn).","e_c122":"Kilder om jødiske kvinner i diasporaen, som synagogeinnskrifter og materialet fra Egypt.","e_c123":"Kvinner i byenes kulter, Demeter og de eleusinske mysteriene, og Isis.","e_c125":"Kvinnene som nevnes i Paulus’ brev: Føbe, Priska, Kloe, Evodia og Syntyke, Junia.","e_c127":"Hvordan Paulus’ tidlige fortolkere leste ham om kvinner og kjønn, blant annet i de deuteropaulinske brevene.","e_r008":"Om kvinnene som profeterer i Korint (1 Kor 11), og om kanons utsagn om kjønn, lest sammen med transaktivisme. Tilgjengelig på nett via Oria.","e_c140":"Nymfa og hustavlen (Kol 3,18–4,1, s. 17–19), Priska med Akvila i Korint (Apg 18,2–3, s. 29–35) og 1 Kor 7 (s. 28).","e_c141":"Slavebundne kvinner i husstanden, med et kort blikk på slavejenta med spådomsånden i Filippi (Apg 16,16–19, s. 107) og på Lydia som mulig frigitt kvinne (s. 108). Les sammen med Glancy.","e_c142":"Kvinner som ledet husstander og forsamlinger: Lydia i Filippi (s. 157), Føbe (s. 158), Nymfa (s. 158) og Priska (s. 162).","e_c143":"Av Janet H. Tulloch. Kvinner ved romerske gravmåltider og i katakombefreskene; kapitlet drøfter ikke 1 Kor 11.","e_c144":"Kvinner som patroner: Føbe i Kenkreæ (Rom 16,1–2, s. 215–16) og Junia Theodora (s. 205–7, 216).","e_c145":"Kvinner i menighetenes utbredelse: Lydia (s. 224, 235–36), Priska, Føbe, og Kelsos’ klage over kvinnelige misjonærer."},"volnote":{"Full of helpful i o on the journal shelf (Ti Jo)":"MF-biblioteket: nettartikkel; tidsskriftet står også på tidsskrifthyllen (Ti Jo)","MF library: e-journal (SAGE)":"MF-biblioteket: e-tidsskrift (SAGE)","MF library: 227.082 618 325 Lo":"MF-biblioteket: 227.082 618 325 Lo","MF library: 270.086 25 Gl":"MF-biblioteket: 270.086 25 Gl","MF library: 225.830 636 2 Ka":"MF-biblioteket: 225.830 636 2 Ka","MF library: 225.879 6 Ho":"MF-biblioteket: 225.879 6 Ho","MF library: 225.95 Ge":"MF-biblioteket: 225.95 Ge","MF library: 281.1 Sa":"MF-biblioteket: 281.1 Sa","MF library: 225.826 6 Sc/2":"MF-biblioteket: 225.826 6 Sc/2","MF library: 262.108 209 015 Ei":"MF-biblioteket: 262.108 209 015 Ei","MF library: 270.108 2 Os":"MF-biblioteket: 270.108 2 Os"},"themes":{"travel":{"title":"Reiser og kommunikasjon i Paulus’ misjon","intro":"Paulus’ misjon var avhengig av veier, skip og brev. Hvordan reiste og kommuniserte folk i antikkens middelhavsverden, fra Via Egnatia til Diolkos ved Korint, og hva forteller det om Paulus’ reiser og brevene hans?"},"synagogue":{"title":"Synagogens rolle i Paulus’ misjon","intro":"Apostlenes gjerninger viser at Paulus begynner i synagogen i by etter by. Hva var synagogen, og hvilken rolle spilte den i misjonen hans?"},"house":{"title":"«Husets» eller «hjemmets» rolle i Paulus’ misjon","intro":"Paulus’ menigheter møttes i hjem (Apg 16,15.40; Rom 16,5; 1 Kor 16,19). Hvilken rolle spilte husstanden i misjonen hans?"},"baptism":{"title":"Dåp i de tidlige menighetene","intro":"Hvordan Paulus bruker dåpen i brevene sine, hva Apostlenes gjerninger tilfører bildet, og hvordan de tidlige kristne utførte ritualet og utviklet det gjennom de første århundrene."},"women":{"title":"Kvinner i de paulinske menighetene og i antikken","intro":"Lydia i Filippi (Apg 16) og Føbe i Kenkreæ (Rom 16,1–2) er kvinner som nevnes ved navn i Det nye testamentet, og Junia Theodora fra Korint kjenner vi fra innskrifter. Hvilken stilling hadde kvinner i den antikke verden, og hvilke roller hadde kvinner i Paulus’ menigheter?"},"agora":{"title":"Torgets rolle i antikkens byer og i Apostlenes gjerninger","intro":"Agora, eller torget, er der Paulus diskuterer i Aten (Apg 17,17), og dit han blir slept i Filippi (Apg 16,19). Hva var torget i en antikk by?"},"kyrios":{"title":"Jesus som kyrios i Filipperbrevet 2","intro":"Fil 2,5–11 ender med bekjennelsen at Jesus Kristus er Herre (kyrios). Hva betyr det å kalle Jesus kyrios, og hvordan passer denne hymnen inn i den tidligkristne gudstjenesten?"},"government":{"title":"Paulus og myndighetene: Gallio, borgerrett og fengsel","intro":"Ifølge Apostlenes gjerninger blir Paulus slått og satt i fengsel i Filippi (Apg 16,16–40), der han viser til sin romerske borgerrett, og ført fram for stattholderen Gallio i Korint (Apg 18,12–17). Hvordan preget romersk styre og rett Paulus’ misjon?"},"associations":{"title":"Foreninger (collegia) og de tidlige menighetene","intro":"Frivillige foreninger (collegia) var sammenslutninger for handel, religion, begravelse og felles måltider, og de fantes i alle greske og romerske byer. I hvilken grad lignet de de tidligkristne forsamlingene?"},"pseudepigraphy":{"title":"Pseudepigrafi og 2 Tessalonikerbrev","intro":"Forskerne er uenige om Paulus skrev 2 Tessalonikerbrev. Dette temaet spør hva pseudepigrafi, det å skrive i en annens navn, betydde i antikken, og hva det forteller om brevet og menighetene som mottok det."},"persecution":{"title":"Forfølgelse","intro":"Hvordan ble de kristne forfulgt i de første århundrene, og hvordan svarte de? Filippi, der Paulus ble satt i fengsel (Apg 16), og Tessalonika, med den senere martyren Demetrios, hører til dette temaet."},"rulercult":{"title":"Herskerkult i en tidligkristen kontekst","intro":"Æresbevisninger for konger og keisere var en del av det offentlige livet i de greske byene. Hvordan forholdt de første kristne seg til herskerkulten?"},"homer":{"title":"Homer og tidligkristen hermeneutikk","intro":"Homer sto i sentrum av den greske utdannelsen. Hvordan forholdt de tidlige kristne seg til de hedenske dikterne, og hvordan preget det måten de leste sine egne tekster på?"},"areopagus":{"title":"Hva ville Paulus på Areopagos?","intro":"Apg 17,16–34 plasserer Paulus foran Areopagos i Aten. Hva gjorde han der, og hvordan vil Lukas at vi skal lese det?"},"stoics":{"title":"Paulus og stoikerne","intro":"Apg 17,18 nevner stoiske filosofer i Aten. Hvor nær stoisismen står Paulus’ tenkning, og hvordan bør vi lese ham sammen med filosofene?"},"apologists":{"title":"De tidligkristne apologetene og den greske kultur og tradisjon","intro":"I det andre århundret forsvarte kristne forfattere, kjent som apologeter, troen på den greske kulturens språk. Hvordan forholdt de seg til gresk kultur og tradisjon?"},"rhetoric":{"title":"Paulus og hans retoriske utdannelse","intro":"Paulus sier at han er «ulærd i tale» (2 Kor 11,6), men forskerne spør fortsatt hvor mye retorisk utdannelse han hadde. Hva betydde utdannelse og retorikk i de greske byene, og hvordan hjelper det oss å lese Paulus?"},"socrates":{"title":"Sokrates i tidligkristen tradisjon","intro":"Justin Martyr tegnet et bilde av Sokrates. Hvordan brukte tidligkristne forfattere ham, og hva sier det om forholdet deres til den greske tradisjonen?"},"mysteries":{"title":"Mysteriekulter og tidlig kristendom","intro":"Mysteriekultene, med Eleusis som det best kjente eksempelet, tilbød innvielse i en guds hemmeligheter og et håp om liv etter døden. Hva var de, og hvordan kan de sammenlignes med den tidlige kristendommen?"},"pythia":{"title":"Pythia: Delfi og kvinnen med en pythisk ånd i Apg 16","intro":"I Apg 16,16–18 har en slavejente i Filippi en «pythisk ånd», et navn som knyttes til oraklet i Delfi. Dette temaet forbinder oraklet i Delfi med fortellingen fra Filippi."},"sport":{"title":"Idrettslekenes rolle i gresk kultur","intro":"Hvilken rolle spilte idrettslekene i gresk kultur, og hva forteller det om bildene Paulus henter fra dem i 1 Kor 9?"},"identity":{"title":"Identitet og etnisitet i det romerske Korint og Filippi","intro":"Byene Paulus besøkte, var sammensatte steder: grekere, romere og lokale folkegrupper levde side om side. Hvordan så folk i Korint og Filippi på seg selv, og hva betydde det for Paulus’ menigheter?"},"meals":{"title":"Rituelle og religiøse måltider i antikken og i Det nye testamentet","intro":"Måltider var en religiøs og sosial institusjon i antikken, fra symposiet til foreningenes middager. Hvordan hjelper de oss å lese nattverden og Paulus’ anvisninger om måltider i 1 Korinterbrev?"},"slavery":{"title":"Slaveri i antikken og i de tidlige menighetene","intro":"Slaveriet var en del av dagliglivet i alle byene på turen. Hvordan var slaveriet i antikken, og hvordan omtaler Det nye testamentet det?"},"status":{"title":"Status, fattigdom og rikdom i Paulus’ menigheter","intro":"Paulus’ menigheter besto ikke av én sosial klasse. Hvor rike eller fattige var medlemmene, og hvordan finner forskerne ut av det? Dette temaet følger debatten om status og fattigdom i Paulus’ menigheter, med Korint og Filippi som de viktigste eksemplene."},"gender":{"title":"Ekteskap, kjønn og renhet i Paulus’ verden","intro":"Paulus skriver om ekteskap i 1 Kor 7, om menn og kvinner i gudstjenesten i 1 Kor 11 og 14, og om seksuell renhet i 1 Tess 4,3–8. Hva betydde ekteskap, kjønn og renhet i byene på turen?"},"asklepios":{"title":"Asklepios-kulten i antikken og helbredelse i Det nye testamentet","intro":"Asklepios var den greske helbredelsesguden, med helligdommer over hele den greske verden, blant annet i Korint. Hvordan kan kulten hans hjelpe oss å lese helbredelsesfortellingene i Det nye testamentet?"},"wreath":{"title":"Kransen som symbol","intro":"Seierskransen var premien ved lekene og et symbol i gresk kultur. Paulus bruker den i 1 Kor 9,25, der idrettsutøveren kjemper om en uforgjengelig krans."}},"notes":{"Roman-period Macedonia: the transport network and the Via Egnatia (pp. 41–46).":"Makedonia i romersk tid: transportnettet og Via Egnatia (s. 41–46).","The Via Egnatia and travel; Paul as letter-writer.":"Via Egnatia og reiser; Paulus som brevskriver.","The strategic location of Corinth: Acrocorinth, the Isthmus and Cenchreae.":"Korints strategiske beliggenhet: Akrokorint, Isthmos og Kenkreæ.","A detailed study of Paul’s mission and the early church.":"En grundig studie av Paulus’ misjon og den tidlige kirken.","Paul’s mission strategy and the chronology of his activities.":"Paulus’ misjonsstrategi og kronologien for virksomheten hans.","The history of earliest Christianity from Jerusalem through Paul’s mission.":"Historien om den tidligste kristendommen, fra Jerusalem til og med Paulus’ misjon.","Paul’s mission and the early church, in detail.":"Paulus’ misjon og den tidlige kirken, i detalj.","The Jewish communities of the Diaspora.":"De jødiske samfunnene i diasporaen.","Evidence for Jewish women in the Diaspora, including the synagogue.":"Kilder om jødiske kvinner i diasporaen, også i synagogen.","The commentary on the synagogue scenes in Acts, with Greco-Roman and Jewish background.":"Kommentaren til synagogescenene i Apostlenes gjerninger, med gresk-romersk og jødisk bakgrunn.","Essays on Acts and its setting.":"Artikler om Apostlenes gjerninger og konteksten.","Household structures and the early Christian mission.":"Husstandsstrukturer og den tidligkristne misjonen.","Conversion and the church as a new family.":"Omvendelse og menigheten som en ny familie.","How large the groups were and where they met.":"Hvor store gruppene var, og hvor de møttes.","Status, households and associations in Paul’s churches.":"Status, husstander og foreninger i Paulus’ menigheter.","Women who led households and assemblies: Lydia at Philippi (p. 157).":"Kvinner som ledet husstander og forsamlinger: Lydia i Filippi (s. 157).","Women as patrons of house churches.":"Kvinner som patroner for husmenigheter.","Women in the spread of the churches: Lydia, Prisca, Phoebe.":"Kvinner i menighetenes utbredelse: Lyd /* ---------- routing ---------- */
function parseHash() {
  const h = (location.hash || '').replace('#', '');
  if (h === 'library' || h === 'mylist') return { route: h, key: null };
  if (h === 'tour') return { route: 'tour', key: null };
  if (h.startsWith('tour-') && PLB[h.slice(5)]) return { route: 'tour', key: h.slice(5) };
  if (h.startsWith('theme-') && themeBy[h.slice(6)]) return { route: 'theme', key: h.slice(6) };
  return { route: 'themes', key: null };
}
function hashOf(r) { return r.route === 'theme' ? 'theme-' + r.key : r.route === 'tour' && r.key ? 'tour-' + r.key : r.route; }
function show(r, push) {
  state.route = r.route; state.key = r.key; state.confirm = false;
  if (push) { try { history.pushState(null, '', '#' + hashOf(r)); } catch (_) { try { location.hash = hashOf(r); } catch (__) {} } }
  render(true);
}
function go(target) {
  if (target === 'themes' || target === 'library' || target === 'mylist' || target === 'tour') show({ route: target, key: null }, true);
  else if (target.startsWith('tour-') && PLB[target.slice(5)]) show({ route: 'tour', key: target.slice(5) }, true);
  else if (target.startsWith('theme-') && themeBy[target.slice(6)]) show({ route: 'theme', key: target.slice(6) }, true);
}
function render(fresh) {
  const r = state.route, app = $('app');

  $('searchbox').hidden = r !== 'library';
  if (r === 'themes') app.innerHTML = themesHTML();

  else if (r === 'mylist') app.innerHTML = mylistHTML();
  else if (r === 'tour') { app.innerHTML = tourHTML(); measure(); updateTour(); }
  else { app.innerHTML = libraryShell(); syncDetails(); updateLibrary(); }
  syncStars(); measure();
  if (r !== 'tour') document.title = r === 'theme' ? themeBy[state.key].title + ' · ' + S.site : S.site;
  if (fresh) {
    const top = $('app').getBoundingClientRect().top + window.scrollY - (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--barh')) || 0) - 12;

function jumpToTag(tag) {

  state.sel.has(tag) ? state.sel.delete(tag) : state.sel.add(tag); updateLibrary();
}

  const nav = t.closest('[data-nav],[data-go]');

  const tv = t.closest('[data-tview]');
  if (tv) { state.tview = tv.dataset.tview; updateTour(); const nb = document.querySelector('[data-tview="' + state.tview + '"]'); if (nb) nb.focus({ preventScroll: true }); return; }
  if (t.closest('[data-stop-clear]')) { clearStop(); return; }
  if (t.closest('[data-tomap]')) { const tv0 = document.querySelector('.tviews'); if (tv0) tv0.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  const stp = t.closest('[data-stop]');
  if (stp) { selectStop(stp.dataset.stop, stp.closest('svg') ? 'map' : 'list'); return; }
  const lt = t.closest('[data-lib-theme]');
  if (lt) { ev.preventDefault(); clearFilters(); state.sel.add('essay-' + lt.dataset.libTheme); show({ route: 'library', key: null }, true); return; }
  const f = t.closest('[data-f]');
  if (f) { const tag = f.dataset.f; state.sel.has(tag) ? state.sel.delete(tag) : state.sel.add(tag); updateLibrary(); const nb = document.querySelector('#facets [data-f="' + tag + '"]'); if (nb) nb.focus({ preventScroll: true }); return; }
  const m = t.closest('[data-mf]');
  if (m) { const k = m.dataset.mf; state.mf.has(k) ? state.mf.delete(k) : state.mf.add(k); updateLibrary(); const nb = document.querySelector('#facets [data-mf="' + k + '"]'); if (nb) nb.focus({ preventScroll: true }); return; }

  const s = t.closest('[data-star]');

  }
  if (t.closest('[data-clear]') || t.closest('#clear')) { clearFilters(); updateLibrary(); $('sum').focus({ preventScroll: true }); return; }
  if (t.closest('#copyAll')) { copyEntries(visible().sort(byAz), t.closest('#copyAll')); return; }
  if (t.closest('#copyMine')) { copyEntries(E.filter(e => state.mine.has(e.id)).sort(byAz), t.closest('#copyMine')); return; }
  if (t.closest('#clearMine')) {
    if (!state.confirm) { state.confirm = true; $('clearMine').textContent = S.confirmEmpty; return; }
    state.mine.clear(); saveMine(); state.confirm = false; render(false); return;
  }

});

let DL = null, dlTimer = null, dlBusy = false;
function dlSentence() {
  return S.dl.replace('__H__', DL ? '' : ' hidden'); /* '<span class="dlsent"' + (DL ? '' : ' hidden') + '> You may download a Word document version of all themes and bibliographies by clicking <button type="button" class="linkbtn" data-dl>here</button>.<span class="dlmsg" id="dlmsg" role="status"></span></span> The compendium of primary texts (Kompendium) opens in two parts: <a href="kompendium/kompendium-del-1.pdf" target="_blank" rel="noopener">part 1, pp. 1–117</a> and <a href="kompendium/kompendium-del-2.pdf" target="_blank" rel="noopener">part 2, pp. 118–223</a>. Each primary text listed in the guide also links to its own pages.'; */
}
function dlSay(t, ms) { const m = $('dlmsg'); if (!m) return; m.textContent = t; clearTimeout(dlTimer); if (ms) dlTimer = setTimeout(() => { const m2 = $('dlmsg'); if (m2) m2.textContent = ''; }, ms); }
async function saveDoc() {
  if (!DL || dlBusy) return;
  dlBusy = true; dlSay(S.preparing);
  try {
    const bin = atob(LANG === 'nb' ? DOC_B64_NB : DOC_B64), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    await DL.save({ filename: LANG === 'nb' ? DOC_FILE_NB : DOC_FILE, data: bytes.buffer });
    dlSay(S.saved, 3000);
  } catch (e) {
    if (e && e.code === 'declined') dlSay('');
    else if (e && e.code === 'rate_limited') dlSay(S.retry, 3000);
    else dlSay(S.noDl, 4000);
  }
  dlBusy = false;
}

  if (!(window.claude && typeof window.claude.use === 'function')) {
